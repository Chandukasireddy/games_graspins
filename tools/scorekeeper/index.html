<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Universal Scorekeeper — Graspins Games</title>
    <meta name="description" content="Simple, universal game score keeper. Write player names and track points in an interactive table for card games, board games, and sports.">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📝</text></svg>">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-page: #060913;
            --bg-card: rgba(17, 24, 39, 0.75);
            --bg-cell: rgba(15, 23, 42, 0.8);
            --bg-hover: rgba(30, 41, 59, 0.8);
            --border: rgba(255, 255, 255, 0.1);
            --border-active: rgba(99, 102, 241, 0.5);
            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
            --accent: #6366f1;
            --accent-hover: #4f46e5;
            --green: #10b981;
            --amber: #f59e0b;
            --rose: #f43f5e;
            --radius: 16px;
            --shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
            --transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background: var(--bg-page);
            background-image: 
                radial-gradient(circle at 50% 0%, rgba(99, 102, 241, 0.15) 0%, transparent 60%),
                radial-gradient(circle at 100% 100%, rgba(236, 72, 153, 0.08) 0%, transparent 50%);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 900px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        /* Header Navigation */
        header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 12px;
            margin-top: 6px;
        }

        .back-link {
            text-decoration: none;
            color: var(--text-secondary);
            display: inline-flex;
            align-items: center;
            gap: 8px;
            font-size: 0.9rem;
            font-weight: 600;
            transition: var(--transition);
        }

        .back-link:hover {
            color: var(--text-primary);
            transform: translateX(-3px);
        }

        .title-group {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-top: 4px;
        }

        .title-icon {
            font-size: 2.2rem;
            filter: drop-shadow(0 0 10px rgba(99, 102, 241, 0.4));
        }

        .title-text {
            font-size: 1.8rem;
            font-weight: 800;
            background: linear-gradient(135deg, #f8fafc 30%, #6366f1 70%, #ec4899 100%);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .header-actions {
            display: flex;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap;
        }

        .btn {
            background: rgba(30, 41, 59, 0.8);
            border: 1px solid var(--border);
            color: var(--text-primary);
            padding: 10px 14px;
            border-radius: 12px;
            font-family: inherit;
            font-size: 0.85rem;
            font-weight: 700;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            transition: var(--transition);
            white-space: nowrap;
        }

        .btn:hover {
            background: rgba(51, 65, 85, 0.9);
            border-color: rgba(255, 255, 255, 0.2);
            transform: translateY(-1px);
        }

        .btn-primary {
            background: linear-gradient(135deg, #6366f1 0%, #4f46e5 100%);
            border: none;
            color: #fff;
            box-shadow: 0 4px 15px rgba(99, 102, 241, 0.3);
        }

        .btn-primary:hover {
            box-shadow: 0 6px 20px rgba(99, 102, 241, 0.45);
        }

        .btn-danger {
            background: rgba(244, 63, 94, 0.15);
            border-color: rgba(244, 63, 94, 0.3);
            color: #f43f5e;
        }

        .btn-danger:hover {
            background: rgba(244, 63, 94, 0.25);
            border-color: #f43f5e;
        }

        /* Controls Panel */
        .controls-card {
            background: var(--bg-card);
            border: 1px solid var(--border);
            backdrop-filter: blur(16px);
            border-radius: var(--radius);
            padding: 14px 18px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 12px;
            box-shadow: var(--shadow);
        }

        .win-rule-toggle {
            display: flex;
            background: rgba(15, 23, 42, 0.8);
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 3px;
        }

        .rule-btn {
            background: transparent;
            border: none;
            color: var(--text-secondary);
            padding: 6px 14px;
            border-radius: 8px;
            font-family: inherit;
            font-size: 0.82rem;
            font-weight: 700;
            cursor: pointer;
            transition: var(--transition);
        }

        .rule-btn.active {
            background: var(--accent);
            color: #fff;
            box-shadow: 0 2px 8px rgba(99, 102, 241, 0.4);
        }

        /* Main Score Table Container */
        .table-card {
            background: var(--bg-card);
            border: 1px solid var(--border);
            backdrop-filter: blur(16px);
            border-radius: var(--radius);
            padding: 18px;
            box-shadow: var(--shadow);
            overflow-x: auto;
        }

        .score-table {
            width: 100%;
            border-collapse: separate;
            border-spacing: 6px;
            text-align: center;
        }

        /* Table Headers (Player Names) */
        .th-player {
            background: rgba(30, 41, 59, 0.7);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 10px 8px;
            min-width: 120px;
            position: relative;
        }

        .th-player.is-leader {
            border-color: #f59e0b;
            box-shadow: 0 0 12px rgba(245, 158, 11, 0.3);
            background: rgba(245, 158, 11, 0.1);
        }

        .player-name-input {
            width: 100%;
            background: transparent;
            border: none;
            color: var(--text-primary);
            font-family: inherit;
            font-size: 1rem;
            font-weight: 800;
            text-align: center;
            outline: none;
            padding: 4px;
            border-radius: 6px;
            transition: var(--transition);
        }

        .player-name-input:focus, .player-name-input:hover {
            background: rgba(15, 23, 42, 0.6);
        }

        .btn-remove-player {
            position: absolute;
            top: -6px;
            right: -6px;
            width: 20px;
            height: 20px;
            border-radius: 50%;
            background: var(--rose);
            color: #fff;
            border: none;
            font-size: 0.75rem;
            cursor: pointer;
            display: none;
            align-items: center;
            justify-content: center;
            line-height: 1;
            box-shadow: 0 2px 6px rgba(0,0,0,0.3);
        }

        .th-player:hover .btn-remove-player {
            display: flex;
        }

        .leader-crown {
            font-size: 0.9rem;
            margin-bottom: 2px;
        }

        /* Totals Row */
        .tr-totals td {
            padding: 12px 8px;
            background: rgba(15, 23, 42, 0.95);
            border: 1px solid var(--border);
            border-radius: 12px;
            font-size: 1.4rem;
            font-weight: 800;
        }

        .tr-totals td.total-leader {
            color: var(--amber);
            border-color: var(--amber);
        }

        /* Score Cells & Inputs */
        .td-round-label {
            color: var(--text-secondary);
            font-weight: 700;
            font-size: 0.85rem;
            padding: 8px 12px;
            white-space: nowrap;
            width: 70px;
        }

        .td-score-cell {
            background: var(--bg-cell);
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 0;
            transition: var(--transition);
        }

        .td-score-cell:focus-within {
            border-color: var(--accent);
            box-shadow: 0 0 10px rgba(99, 102, 241, 0.3);
            background: rgba(30, 41, 59, 0.9);
        }

        .cell-input {
            width: 100%;
            height: 44px;
            background: transparent;
            border: none;
            color: #fff;
            font-family: inherit;
            font-size: 1.05rem;
            font-weight: 700;
            text-align: center;
            outline: none;
            padding: 4px;
        }

        /* Bottom Quick Add Bar */
        .quick-add-bar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-top: 12px;
            padding-top: 12px;
            border-top: 1px solid var(--border);
            gap: 12px;
        }

        .empty-state {
            text-align: center;
            padding: 30px 20px;
            color: var(--text-secondary);
            font-size: 0.95rem;
        }

        @media (max-width: 600px) {
            header { flex-direction: column; align-items: flex-start; }
            .controls-card { flex-direction: column; align-items: stretch; }
            .cell-input { height: 40px; font-size: 0.95rem; }
            .th-player { min-width: 90px; }
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Header -->
        <header>
            <div>
                <a href="../../index.html" class="back-link">➔ Back to Games</a>
                <div class="title-group">
                    <span class="title-icon">📝</span>
                    <h1 class="title-text">Universal Scorekeeper</h1>
                </div>
            </div>
            <div class="header-actions">
                <button class="btn btn-primary" id="btn-add-player">➕ Add Player</button>
                <button class="btn btn-primary" id="btn-add-round">➕ Add Round</button>
                <button class="btn btn-danger" id="btn-reset">🔄 Reset All</button>
                <button class="btn" id="btn-share">📋 Share</button>
            </div>
        </header>

        <!-- Controls Card -->
        <div class="controls-card">
            <div style="display: flex; align-items: center; gap: 10px;">
                <span style="font-size: 0.85rem; font-weight: 700; color: var(--text-secondary);">Winning Rule:</span>
                <div class="win-rule-toggle">
                    <button class="rule-btn active" id="rule-high" data-rule="high">🏆 Highest Wins</button>
                    <button class="rule-btn" id="rule-low" data-rule="low">🎯 Lowest Wins (Rummy/Golf)</button>
                </div>
            </div>
            <div style="font-size: 0.85rem; color: var(--text-secondary); font-weight: 600;">
                Click names or cells to edit directly • Auto-saves locally
            </div>
        </div>

        <!-- Scoreboard Table Card -->
        <div class="table-card">
            <table class="score-table">
                <thead>
                    <tr id="tr-header">
                        <th class="td-round-label">Round</th>
                        <!-- Player Column Headers dynamically generated -->
                    </tr>
                </thead>
                <tbody id="tbody-rounds">
                    <!-- Round rows dynamically generated -->
                </tbody>
                <tfoot>
                    <tr id="tr-totals" class="tr-totals">
                        <td class="td-round-label" style="font-weight: 800; color: var(--text-primary); font-size: 1rem;">TOTAL</td>
                        <!-- Total cells dynamically generated -->
                    </tr>
                </tfoot>
            </table>
        </div>
    </div>

    <script>
        // Back link handler for portal iframe integration
        document.addEventListener('click', function(e) {
            const backBtn = e.target.closest('.back-link, #back-link, #backButton');
            if (backBtn && window.self !== window.top) {
                e.preventDefault();
                window.parent.postMessage({ type: 'CLOSE_GAME' }, '*');
            }
        });

        // Web Audio sound effects
        let audioCtx = null;
        function playSound(freq = 600, duration = 0.08) {
            try {
                if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                if (audioCtx.state === 'suspended') audioCtx.resume();
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
                gain.gain.setValueAtTime(0.08, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start();
                osc.stop(audioCtx.currentTime + duration);
            } catch(e) {}
        }

        // App State
        const STORAGE_KEY = 'graspins_universal_scorekeeper_v2';

        let state = {
            winRule: 'high', // 'high' or 'low'
            players: ['Player 1', 'Player 2', 'Player 3'],
            rounds: [
                [0, 0, 0] // array of score rows (each row is an array of numbers corresponding to players)
            ]
        };

        function loadState() {
            try {
                const saved = localStorage.getItem(STORAGE_KEY);
                if (saved) {
                    const parsed = JSON.parse(saved);
                    if (parsed && Array.isArray(parsed.players) && parsed.players.length > 0) {
                        state = parsed;
                    }
                }
            } catch(e) {}
        }

        function saveState() {
            try {
                localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
            } catch(e) {}
        }

        function getTotals() {
            const totals = new Array(state.players.length).fill(0);
            state.rounds.forEach(row => {
                row.forEach((score, pIdx) => {
                    if (pIdx < totals.length) {
                        totals[pIdx] += (score || 0);
                    }
                });
            });
            return totals;
        }

        function getLeaders() {
            const totals = getTotals();
            if (totals.length === 0) return [];
            
            let bestScore = state.winRule === 'high' ? -Infinity : Infinity;
            totals.forEach(t => {
                if (state.winRule === 'high') {
                    if (t > bestScore) bestScore = t;
                } else {
                    if (t < bestScore) bestScore = t;
                }
            });

            // Return indices of leaders
            const leaders = [];
            totals.forEach((t, i) => {
                if (t === bestScore) leaders.push(i);
            });
            return leaders;
        }

        function render() {
            const totals = getTotals();
            const leaders = getLeaders();

            // 1. Render Header (Players)
            const trHeader = document.getElementById('tr-header');
            trHeader.innerHTML = '<th class="td-round-label">Round</th>';

            state.players.forEach((pName, pIdx) => {
                const isLeader = leaders.includes(pIdx);
                const th = document.createElement('th');
                th.className = `th-player ${isLeader ? 'is-leader' : ''}`;
                th.innerHTML = `
                    ${isLeader ? '<div class="leader-crown">👑</div>' : '<div style="height: 18px;"></div>'}
                    <input type="text" class="player-name-input" value="${escapeHtml(pName)}" data-pidx="${pIdx}">
                    ${state.players.length > 1 ? `<button class="btn-remove-player" data-pidx="${pIdx}" title="Remove player">✕</button>` : ''}
                `;
                trHeader.appendChild(th);
            });

            // 2. Render Rounds
            const tbody = document.getElementById('tbody-rounds');
            tbody.innerHTML = '';

            state.rounds.forEach((row, rIdx) => {
                const tr = document.createElement('tr');
                let rowHtml = `<td class="td-round-label">#${rIdx + 1}</td>`;

                state.players.forEach((_, pIdx) => {
                    const score = row[pIdx] !== undefined ? row[pIdx] : '';
                    rowHtml += `
                        <td class="td-score-cell">
                            <input type="number" class="cell-input" value="${score !== '' && score !== 0 ? score : (score === 0 ? 0 : '')}" placeholder="0" data-ridx="${rIdx}" data-pidx="${pIdx}">
                        </td>
                    `;
                });
                tr.innerHTML = rowHtml;
                tbody.appendChild(tr);
            });

            // 3. Render Totals Row
            const trTotals = document.getElementById('tr-totals');
            trTotals.innerHTML = '<td class="td-round-label" style="font-weight: 800; color: var(--text-primary); font-size: 0.95rem;">TOTAL</td>';

            state.players.forEach((_, pIdx) => {
                const isLeader = leaders.includes(pIdx);
                const td = document.createElement('td');
                td.className = isLeader ? 'total-leader' : '';
                td.textContent = totals[pIdx] || 0;
                trTotals.appendChild(td);
            });

            // 4. Bind Input Listeners
            bindEvents();
            saveState();
        }

        function bindEvents() {
            // Player name edit
            document.querySelectorAll('.player-name-input').forEach(input => {
                input.addEventListener('change', (e) => {
                    const pIdx = parseInt(e.target.getAttribute('data-pidx'));
                    state.players[pIdx] = e.target.value.trim() || `Player ${pIdx + 1}`;
                    render();
                });
            });

            // Remove player button
            document.querySelectorAll('.btn-remove-player').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    const pIdx = parseInt(e.target.getAttribute('data-pidx'));
                    if (state.players.length <= 1) return;
                    state.players.splice(pIdx, 1);
                    state.rounds.forEach(r => r.splice(pIdx, 1));
                    playSound(400, 0.08);
                    render();
                });
            });

            // Score cell edits
            document.querySelectorAll('.cell-input').forEach(input => {
                input.addEventListener('change', (e) => {
                    const rIdx = parseInt(e.target.getAttribute('data-ridx'));
                    const pIdx = parseInt(e.target.getAttribute('data-pidx'));
                    const val = e.target.value !== '' ? parseInt(e.target.value) : 0;
                    
                    if (!state.rounds[rIdx]) state.rounds[rIdx] = [];
                    state.rounds[rIdx][pIdx] = isNaN(val) ? 0 : val;
                    playSound(650, 0.04);
                    render();
                });

                // Auto-advance to next cell on Enter
                input.addEventListener('keydown', (e) => {
                    if (e.key === 'Enter') {
                        e.preventDefault();
                        const rIdx = parseInt(e.target.getAttribute('data-ridx'));
                        const pIdx = parseInt(e.target.getAttribute('data-pidx'));

                        if (pIdx < state.players.length - 1) {
                            const nextInput = document.querySelector(`.cell-input[data-ridx="${rIdx}"][data-pidx="${pIdx + 1}"]`);
                            if (nextInput) nextInput.focus();
                        } else if (rIdx < state.rounds.length - 1) {
                            const nextInput = document.querySelector(`.cell-input[data-ridx="${rIdx + 1}"][data-pidx="0"]`);
                            if (nextInput) nextInput.focus();
                        } else {
                            // Hit enter on last cell -> add new round automatically!
                            addRound();
                        }
                    }
                });
            });
        }

        function addPlayer() {
            const nextNum = state.players.length + 1;
            state.players.push(`Player ${nextNum}`);
            state.rounds.forEach(r => r.push(0));
            playSound(750, 0.08);
            render();
        }

        function addRound() {
            const newRow = new Array(state.players.length).fill(0);
            state.rounds.push(newRow);
            playSound(850, 0.08);
            render();
            // Focus first input of new round
            setTimeout(() => {
                const firstCell = document.querySelector(`.cell-input[data-ridx="${state.rounds.length - 1}"][data-pidx="0"]`);
                if (firstCell) firstCell.focus();
            }, 50);
        }

        function escapeHtml(str) {
            return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
        }

        // Global Control Events
        document.getElementById('btn-add-player').addEventListener('click', addPlayer);
        document.getElementById('btn-add-round').addEventListener('click', addRound);

        document.getElementById('rule-high').addEventListener('click', () => {
            state.winRule = 'high';
            document.getElementById('rule-high').classList.add('active');
            document.getElementById('rule-low').classList.remove('active');
            render();
        });

        document.getElementById('rule-low').addEventListener('click', () => {
            state.winRule = 'low';
            document.getElementById('rule-low').classList.add('active');
            document.getElementById('rule-high').classList.remove('active');
            render();
        });

        document.getElementById('btn-reset').addEventListener('click', () => {
            if (confirm('Reset scores for all rounds? Player names will be kept.')) {
                state.rounds = [new Array(state.players.length).fill(0)];
                playSound(300, 0.15);
                render();
            }
        });

        document.getElementById('btn-share').addEventListener('click', () => {
            const totals = getTotals();
            const leaders = getLeaders();

            let text = `📝 *Scorekeeper Game Results*\n`;
            text += `Rule: ${state.winRule === 'high' ? 'Highest Wins' : 'Lowest Wins'}\n`;
            text += `Rounds: ${state.rounds.length}\n\n`;

            state.players.forEach((pName, pIdx) => {
                const isLeader = leaders.includes(pIdx);
                text += `${isLeader ? '👑 ' : '• '}${pName}: ${totals[pIdx] || 0} pts\n`;
            });

            if (navigator.clipboard) {
                navigator.clipboard.writeText(text);
                alert('Score summary copied to clipboard!');
            } else {
                alert(text);
            }
        });

        // Initialize
        loadState();
        if (state.winRule === 'low') {
            document.getElementById('rule-low').classList.add('active');
            document.getElementById('rule-high').classList.remove('active');
        }
        render();
    </script>
</body>
</html>
