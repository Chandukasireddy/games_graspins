<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Graspins Games Redirecting...</title>
    <script type="text/javascript">
        // SPA redirect handler for static page hosting (like GitHub Pages)
        var pathSegmentsToKeep = 0;
        var l = window.location;
        l.replace(
            l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
            l.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/') +
            '/?p=' + encodeURIComponent(l.pathname.slice(1).replace(/&/g, '~and~')) +
            (l.search ? '&q=' + encodeURIComponent(l.search.slice(1)) : '') +
            l.hash
        );
    </script>
</head>
<body>
</body>
</html>
