<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Who is the Spy? 🕵️</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        *, *::before, *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        :root {
            --bg-deep: #0c0a1d;
            --bg-surface: #161332;
            --indigo-500: #6366f1;
            --indigo-600: #4f46e5;
            --indigo-700: #4338ca;
            --violet-600: #7c3aed;
            --rose-500: #f43f5e;
            --rose-600: #e11d48;
            --emerald-500: #10b981;
            --text-primary: #f1f5f9;
            --text-secondary: #94a3b8;
            --text-muted: #64748b;
            --glass-bg: rgba(255, 255, 255, 0.95);
            --glass-ring: rgba(255, 255, 255, 0.25);
            --card-radius: 1rem;
        }

        html, body {
            height: 100%;
            overflow-x: hidden;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: radial-gradient(ellipse 800px 500px at 50% -5%, #312e81 0%, #1e1b4b 35%, var(--bg-deep) 100%);
            color: var(--text-primary);
            min-height: 100dvh;
            -webkit-tap-highlight-color: transparent;
        }

        /* ===== Top Navigation Bar (game screen only) ===== */
        .top-nav {
            position: sticky;
            top: 0;
            z-index: 50;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 12px 16px;
            background: rgba(12, 10, 29, 0.7);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
        }

        .nav-btn {
            width: 42px;
            height: 42px;
            display: flex;
            align-items: center;
            justify-content: center;
            border: none;
            border-radius: 12px;
            background: rgba(255, 255, 255, 0.08);
            color: var(--text-primary);
            font-size: 1.25rem;
            cursor: pointer;
            transition: background 0.2s, transform 0.15s;
        }

        .nav-btn:active {
            transform: scale(0.92);
            background: rgba(255, 255, 255, 0.15);
        }

        .nav-title {
            font-size: 1rem;
            font-weight: 700;
            letter-spacing: -0.01em;
        }

        /* ===== Setup Screen ===== */
        .setup-wrapper {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100dvh;
            padding: 24px 16px;
        }

        .setup-header {
            text-align: center;
            margin-bottom: 28px;
        }

        .setup-header h1 {
            font-size: 2rem;
            font-weight: 900;
            letter-spacing: -0.03em;
            color: #fff;
        }

        .setup-header p {
            font-size: 0.875rem;
            color: var(--text-secondary);
            margin-top: 8px;
        }

        .setup-card {
            background: var(--glass-bg);
            color: #1e293b;
            width: 100%;
            max-width: 420px;
            padding: 28px 20px;
            border-radius: 24px;
            box-shadow: 0 24px 48px rgba(0, 0, 0, 0.35);
            border: 1px solid var(--glass-ring);
        }

        .setup-card h2 {
            font-size: 1.25rem;
            font-weight: 800;
            text-align: center;
            color: #0f172a;
            margin-bottom: 4px;
        }

        .setup-card .subtitle {
            text-align: center;
            font-size: 0.8rem;
            color: var(--text-muted);
            margin-bottom: 24px;
        }

        .option-group {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 20px;
        }

        .option-item {
            display: flex;
            flex-direction: column;
            gap: 6px;
            background: #f8fafc;
            border-radius: 16px;
            padding: 14px;
            border: 1px solid #e2e8f0;
        }

        .option-label {
            font-size: 0.7rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.06em;
        }

        .option-label.players { color: var(--indigo-600); }
        .option-label.spies { color: var(--rose-600); }
        .option-label.mode { color: var(--emerald-500); }

        .option-input,
        .option-select {
            width: 100%;
            padding: 12px;
            border: 1.5px solid #e2e8f0;
            border-radius: 12px;
            text-align: center;
            font-size: 1.5rem;
            font-weight: 800;
            color: #0f172a;
            background: #fff;
            outline: none;
            transition: border-color 0.2s, box-shadow 0.2s;
            -webkit-appearance: none;
        }

        .option-input:focus {
            border-color: var(--indigo-500);
            box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.15);
        }

        .option-select {
            font-size: 1rem;
            font-weight: 600;
        }

        .option-hint {
            font-size: 0.7rem;
            color: #94a3b8;
            text-align: center;
        }

        .mode-hint {
            font-size: 0.78rem;
            color: var(--text-muted);
            text-align: center;
            background: #eef2ff;
            border-radius: 12px;
            padding: 10px 14px;
            margin-bottom: 20px;
            line-height: 1.5;
        }

        .start-btn {
            width: 100%;
            padding: 16px;
            border: none;
            border-radius: 16px;
            background: linear-gradient(135deg, var(--indigo-600), var(--violet-600));
            color: #fff;
            font-size: 1.05rem;
            font-weight: 700;
            cursor: pointer;
            transition: transform 0.15s, opacity 0.2s;
            box-shadow: 0 8px 24px rgba(79, 70, 229, 0.35);
        }

        .start-btn:active {
            transform: scale(0.98);
        }

        .start-btn:disabled {
            opacity: 0.55;
            cursor: not-allowed;
        }

        .error-text {
            color: var(--rose-500);
            font-size: 0.82rem;
            font-weight: 600;
            text-align: center;
            margin-top: 12px;
            min-height: 20px;
        }

        /* ===== Game Screen ===== */
        .game-container {
            padding: 12px 12px 32px;
        }

        .card-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
        }

        @media (min-width: 480px) {
            .card-grid {
                gap: 14px;
            }
        }

        @media (min-width: 640px) {
            .card-grid {
                grid-template-columns: repeat(3, 1fr);
                gap: 16px;
            }
        }

        @media (min-width: 900px) {
            .card-grid {
                grid-template-columns: repeat(4, 1fr);
            }
        }

        /* ===== Card ===== */
        .card {
            perspective: 1000px;
            cursor: pointer;
            animation: pop-in 0.35s ease both;
        }

        .card-inner {
            position: relative;
            width: 100%;
            padding-top: 120%;  /* aspect ratio for tall mobile cards */
            transition: transform 0.6s cubic-bezier(0.4, 0.0, 0.2, 1);
            transform-style: preserve-3d;
            border-radius: var(--card-radius);
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.3);
        }

        .card.flipped .card-inner {
            transform: rotateY(180deg);
        }

        .card-face {
            position: absolute;
            inset: 0;
            -webkit-backface-visibility: hidden;
            backface-visibility: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            border-radius: var(--card-radius);
            overflow: hidden;
            padding: 12px;
            text-align: center;
        }

        .card-front {
            background: linear-gradient(145deg, var(--indigo-500), var(--violet-600));
            color: #fff;
        }

        .card-front .player-icon {
            font-size: 1.8rem;
            margin-bottom: 4px;
        }

        .card-front .player-num {
            font-size: 1.3rem;
            font-weight: 800;
        }

        .card-front .tap-hint {
            font-size: 0.65rem;
            color: rgba(255, 255, 255, 0.6);
            margin-top: 4px;
        }

        .card-back {
            transform: rotateY(180deg);
        }

        .card-back.civilian {
            background: linear-gradient(145deg, #eef2ff, #fff);
            border: 2px solid #c7d2fe;
        }

        .card-back.spy {
            background: linear-gradient(145deg, #fff1f2, #fff);
            border: 3px solid var(--rose-500);
        }

        .card-back .word-label {
            font-size: 0.6rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            color: #a5b4fc;
        }

        .card-back .word-text {
            font-size: 1.15rem;
            font-weight: 800;
            color: #1e293b;
            margin-top: 6px;
            line-height: 1.2;
            word-break: break-word;
        }

        .card-back.spy .spy-title {
            font-size: 1.5rem;
            font-weight: 900;
            color: var(--rose-600);
        }

        .card-back.spy .spy-subtitle {
            font-size: 0.7rem;
            color: #64748b;
            margin-top: 6px;
        }

        /* ===== Revealed State ===== */
        .card.revealed .card-inner {
            transform: none;
        }

        .card.revealed .card-front {
            background: #111827;
            color: #6b7280;
        }

        .card.revealed .card-front .player-icon {
            display: none;
        }

        .card.revealed .card-front .tap-hint {
            display: none;
        }

        .card.revealed {
            cursor: default;
        }

        .revealed-word {
            font-size: 0.85rem;
            font-weight: 600;
            color: #9ca3af;
            margin-top: 2px;
            word-break: break-word;
            line-height: 1.3;
        }

        /* ===== Animations ===== */
        @keyframes pop-in {
            from {
                opacity: 0;
                transform: translateY(10px) scale(0.96);
            }
            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        /* ===== Utilities ===== */
        .hidden {
            display: none !important;
        }
    </style>
</head>
<body>

    <!-- ======== SETUP SCREEN ======== -->
    <div id="setup-screen" class="setup-wrapper">
        <div class="setup-header">
            <h1>Who is the Spy? 🕵️</h1>
            <p>Pass the device around — uncover the spy hiding among you.</p>
        </div>

        <div class="setup-card">
            <h2>Game Setup</h2>
            <p class="subtitle">Choose your options, then start the round.</p>

            <div class="option-group">
                <div class="option-item">
                    <label for="player-count" class="option-label players">👥 Players</label>
                    <input type="number" id="player-count" min="3" max="25" value="4" class="option-input" inputmode="numeric">
                    <span class="option-hint">3 – 25 players</span>
                </div>
                <div class="option-item">
                    <label for="spy-count" class="option-label spies">🎭 Spies</label>
                    <input type="number" id="spy-count" min="1" max="24" value="1" class="option-input" inputmode="numeric">
                    <span class="option-hint">fewer than players</span>
                </div>
                <div class="option-item">
                    <label for="spy-mode" class="option-label mode">⚙️ Spy Mode</label>
                    <select id="spy-mode" class="option-select">
                        <option value="spy">Classic</option>
                        <option value="random">Random word</option>
                    </select>
                    <span class="option-hint">how the spy is shown</span>
                </div>
            </div>

            <p id="mode-hint" class="mode-hint">
                In <strong>Random</strong> mode the spy gets a different word and won't know they're the spy.
            </p>

            <button id="start-button" class="start-btn">Start Game</button>
            <p id="error-message" class="error-text"></p>
        </div>
    </div>

    <!-- ======== GAME SCREEN ======== -->
    <div id="game-screen" class="hidden">
        <!-- Minimal top bar -->
        <nav class="top-nav">
            <button id="back-button" class="nav-btn" aria-label="Go back">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                    <polyline points="15 18 9 12 15 6"></polyline>
                </svg>
            </button>
            <span class="nav-title">🕵️ Spy</span>
            <button id="settings-button" class="nav-btn" aria-label="Settings">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="12" cy="12" r="3"></circle>
                    <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
                </svg>
            </button>
        </nav>

        <div class="game-container">
            <div id="card-grid" class="card-grid">
                <!-- Cards generated by JavaScript -->
            </div>
        </div>
    </div>

    <script>
        // ===== State =====
        let allWords = [];
        let availableWords = [];
        let currentlyOpenCard = null;

        // ===== DOM =====
        const setupScreen  = document.getElementById('setup-screen');
        const gameScreen    = document.getElementById('game-screen');
        const startButton   = document.getElementById('start-button');
        const backButton    = document.getElementById('back-button');
        const settingsButton = document.getElementById('settings-button');
        const playerCountInput = document.getElementById('player-count');
        const spyCountInput    = document.getElementById('spy-count');
        const spyModeSelect    = document.getElementById('spy-mode');
        const cardGrid       = document.getElementById('card-grid');
        const errorMessage   = document.getElementById('error-message');

        // ===== Word Loading =====
        async function loadWords() {
            try {
                startButton.disabled = true;
                startButton.textContent = 'Loading Words…';

                const sheetURL = 'https://docs.google.com/spreadsheets/d/1k3pE4dRKMqpACy6NCLhOkmeZZS0gj0TQ_8XCim6xt_k/export?format=csv';
                const response = await fetch(sheetURL);

                if (!response.ok) throw new Error(`HTTP error! status: ${response.status}`);
                const data = await response.text();

                allWords = data
                    .split(/\r?\n/)
                    .slice(1)
                    .map(w => w.trim())
                    .filter(w => w.length > 0);

                if (allWords.length === 0) throw new Error('Sheet is empty or formatted incorrectly.');

                availableWords = [...allWords];
                startButton.disabled = false;
                startButton.textContent = 'Start Game';
            } catch (error) {
                console.error('Failed to load words:', error);
                errorMessage.textContent = 'Error: Could not load game words.';
                startButton.textContent = 'Error Loading';
            }
        }

        // ===== Events =====
        document.addEventListener('DOMContentLoaded', loadWords);
        startButton.addEventListener('click', startGame);
        backButton.addEventListener('click', goToMenu);
        settingsButton.addEventListener('click', goToMenu);

        // ===== Start Game =====
        function startGame() {
            const playerCount = parseInt(playerCountInput.value, 10);
            const spyCount    = parseInt(spyCountInput.value, 10);
            const spyMode     = spyModeSelect.value;

            if (isNaN(playerCount) || playerCount < 3 || playerCount > 25) {
                showError('Please choose between 3 and 25 players.');
                return;
            }
            if (isNaN(spyCount) || spyCount < 1) {
                showError('There must be at least 1 spy.');
                return;
            }
            if (spyCount >= playerCount) {
                showError('Number of spies must be less than the number of players.');
                return;
            }
            errorMessage.textContent = '';

            if (availableWords.length === 0) {
                if (allWords.length > 0) {
                    availableWords = [...allWords];
                } else {
                    showError('No words available to start the game.');
                    return;
                }
            }

            // Pick civilian word
            const wordIndex = Math.floor(Math.random() * availableWords.length);
            const chosenWord = availableWords[wordIndex];
            availableWords.splice(wordIndex, 1);

            // Pick spy word for random mode
            let spyWord = '';
            if (spyMode === 'random') {
                const otherWords = allWords.filter(w => w !== chosenWord);
                if (otherWords.length > 0) {
                    spyWord = otherWords[Math.floor(Math.random() * otherWords.length)];
                }
            }

            // Assign spy positions
            const spyIndexes = new Set();
            while (spyIndexes.size < spyCount) {
                spyIndexes.add(Math.floor(Math.random() * playerCount));
            }

            // Build cards
            currentlyOpenCard = null;
            cardGrid.innerHTML = '';
            for (let i = 0; i < playerCount; i++) {
                const isSpy = spyIndexes.has(i);
                let word, role;
                if (isSpy) {
                    if (spyMode === 'random') {
                        word = spyWord;
                        role = 'Civilian';
                    } else {
                        word = '';
                        role = 'SPY';
                    }
                } else {
                    word = chosenWord;
                    role = 'Civilian';
                }
                createCard(i + 1, word, role);
            }

            // Switch to game screen
            setupScreen.classList.add('hidden');
            gameScreen.classList.remove('hidden');
        }

        // ===== Create Card =====
        function createCard(playerNumber, word, role) {
            const card = document.createElement('div');
            card.className = 'card';
            card.style.animationDelay = `${(playerNumber - 1) * 0.04}s`;
            card.dataset.word = word;
            card.dataset.role = role;

            const isSpy = role === 'SPY';

            const backClass = isSpy ? 'card-face card-back spy' : 'card-face card-back civilian';
            const backContent = isSpy
                ? `<p class="spy-title">You are the SPY!</p>
                   <p class="spy-subtitle">Blend in and find the word.</p>`
                : `<p class="word-label">Your word</p>
                   <p class="word-text">${word}</p>`;

            card.innerHTML = `
                <div class="card-inner">
                    <div class="card-face card-front">
                        <span class="player-icon">🪪</span>
                        <p class="player-num">Player ${playerNumber}</p>
                        <p class="tap-hint">Tap to reveal</p>
                    </div>
                    <div class="${backClass}">
                        ${backContent}
                    </div>
                </div>
            `;

            const handleFlip = () => {
                // Already revealed — ignore
                if (card.classList.contains('revealed')) return;

                if (card.classList.contains('flipped')) {
                    // Flip back and mark as revealed
                    card.classList.remove('flipped');
                    card.classList.add('revealed');

                    // Update front to blacked-out with the word shown
                    const front = card.querySelector('.card-front');
                    const displayWord = card.dataset.role === 'SPY' ? 'SPY' : card.dataset.word;
                    front.innerHTML = `
                        <p class="player-num">Player ${playerNumber}</p>
                        <p class="revealed-word">${displayWord}</p>
                    `;

                    currentlyOpenCard = null;
                } else {
                    // Only one card open at a time
                    if (currentlyOpenCard && currentlyOpenCard !== card) return;
                    card.classList.add('flipped');
                    currentlyOpenCard = card;
                }
            };

            card.addEventListener('click', handleFlip);
            cardGrid.appendChild(card);
        }

        // ===== Helpers =====
        function showError(msg) {
            errorMessage.textContent = msg;
        }

        function goToMenu() {
            currentlyOpenCard = null;
            cardGrid.innerHTML = '';
            gameScreen.classList.add('hidden');
            setupScreen.classList.remove('hidden');
        }
    </script>
</body>
</html>
